problem:
  name: merged
  description: 2D wave equation on merged dataset (constant_force + forced_sine + free_evolution)
  matlab:
    script: wave_2D_matlab_reference.m
    t_final: 1.0
    nt_time_steps: 10
    nx: 100
    ny: 100
    n_samples: 5000
    wave_speed: 1.0
    damping: 1.0
    forcing_amplitude: 1.0
    source_center_x: 0.35
    source_center_y: 0.65
    source_width: 0.3
    fourier_modes_k: 4
    fourier_modes_l: 4
svd:
  n_modes: 18
  visualize: false
  magnitude_summary:
    raw_u:
      min: -0.209636
      max: 0.210539
    raw_v:
      min: -1.40244
      max: 1.40335
    raw_f:
      min: -10.0
      max: 10.0
    svd_basis_u:
      min: 0.0
      max: 0.0131213
      mean: 0.00233243
      std: 0.00213536
    sigma_coeff_u:
      min: 9.64201e-06
      max: 19.9072
      mean: 1.84586
      std: 3.18817
    svd_basis_v:
      min: 0.0
      max: 0.028054
      mean: 0.00115043
      std: 0.00294559
    sigma_coeff_v:
      min: 3.0228e-05
      max: 48.7683
      mean: 5.93467
      std: 8.56565
networks:
  trunk:
    input_dim: 3
    output_dim: 18
    hidden_dim: 128
    n_layers: 4
    visualize: false
  branch:
    input_dim: 64
    output_dim: 18
    hidden_dim: 128
    n_layers: 4
    visualize: false
training:
  batch_size: 256
  learning_rate: 0.001
  train_test_split: 0.8
  trunk_n_epochs: 2000
  branch_n_epochs: 2000
  deeponet_n_epochs: 200
  finetune_deeponet: true
  max_trunk_points: 5000
  max_branch_samples: null
  max_deeponet_samples: 250
  points_per_sample: 100
  use_pinn_loss: true
  pde_loss_weight: 1.0
  pde_loss_weight_uv: 1.0
  pde_loss_weight_wave: 1.0
  pde_loss_weight_start_factor: 0.01
  pde_loss_weight_end_factor: 1.0
  pde_loss_weight_warmup_epochs: 30
  pde_loss_weight_schedule: linear
  rollout_pi_use_all_samples: true
  n_collocation_per_batch: 4096
  deeponet_branch_input_noise:
    enabled: true
    std: 0.05
    apply_to_force: false
    clip_min: -1.0
    clip_max: 1.0
  deeponet_rollout:
    enabled: true
    horizon: 3
    step_stride: 1
    dt: null
    batch_size: 4
    chunk_size: 4096
    eval_max_samples: 8
    step_weights: null
validation:
  rollout_dt: null
sensors:
  n_sensors: 8
