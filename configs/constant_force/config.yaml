problem:
  name: constant_force
  description: 2D wave equation with random Fourier IC, constant forcing
  matlab:
    script: wave_2D_matlab_reference.m
    t_final: 1.0
    nt_time_steps: 10
    nx: 100
    ny: 100
    n_samples: 5000
    wave_speed: 1.0
    damping: 1.0
    forcing_amplitude: 1.0
    source_center_x: 0.35
    source_center_y: 0.65
    source_width: 0.3
    fourier_modes_k: 4
    fourier_modes_l: 4
svd:
  n_modes: 18
  visualize: false
  magnitude_summary:
    raw_u:
      min: -0.209636
      max: 0.210539
    raw_v:
      min: -1.40244
      max: 1.40335
    raw_f:
      min: -10.0
      max: 10.0
    svd_basis_u:
      min: 0.0
      max: 0.0131213
      mean: 0.00233243
      std: 0.00213536
    sigma_coeff_u:
      min: 9.64201e-06
      max: 19.9072
      mean: 1.84586
      std: 3.18817
    svd_basis_v:
      min: 0.0
      max: 0.028054
      mean: 0.00115043
      std: 0.00294559
    sigma_coeff_v:
      min: 3.0228e-05
      max: 48.7683
      mean: 5.93467
      std: 8.56565
networks:
  trunk:
    input_dim: 3
    output_dim: 18
    hidden_dim: 128
    n_layers: 4
    visualize: true
  branch:
    input_dim: 64
    output_dim: 18
    hidden_dim: 128
    n_layers: 4
    visualize: true
training:
  batch_size: 256
  learning_rate: 0.001
  train_test_split: 0.8
  trunk_n_epochs: 2000
  branch_n_epochs: 2000
  deeponet_n_epochs: 0
  max_trunk_points: 10000
  max_branch_samples: null
  max_deeponet_samples: null
  points_per_sample: 5000
  use_pinn_loss: false
  pde_loss_weight: 0.5
  n_collocation_per_batch: 4096
sensors:
  n_sensors: 8
