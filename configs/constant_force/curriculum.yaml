defaults:
  - config
  - _self_

curriculum:
  # If null, stage 0 starts from script_dir/models.
  initial_pretrained_models_dir: models
  # Keep global config untouched by default while iterating stages.
  save_default_config_summary: false
  # Validation can be expensive; usually run it on the final stage only.
  run_validation_each_step: true
  run_validation_last_step: true
  steps:
    - name: step_0_pretrain_trunk_branch
      overrides:
        training:
          trunk_n_epochs: 2000
          branch_n_epochs: 2000
          deeponet_n_epochs: 0
          finetune_deeponet: false
          use_pinn_loss: false
          deeponet_rollout:
            enabled: false

