hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

# Run settings
run:
  # Model Loading
  load_model: false
  load_from: ['2025-12-19','22-23-40']  # [date, time] of checkpoint to load
  
  # Pretrained Trunk Loading (used when load_model=false)
  load_pretrained_trunk: true
  pretrained_trunk_path: outputs/2025-12-25/11-39-16/pretrained_trunk.pth
  freeze_trunk: true
  
  # Resume Training (continue from checkpoint)
  # Only used if load_model=true
  # If false: skip training and go directly to validation
  resume_training: true

training:
  n_epochs: 4000
  lr: 0.001
  lr_scheduler_gamma: 1.0  # Exponential decay factor per epoch (0.995 = ~0.5% decay/epoch)
  # log_interval: 200
  val_interval: 1
  es_patience: 40000
  max_grad_norm: 1.0
  max_grad_ph1: 0.6
  n_batches: 1024
  n_batches_ph1: 16
  n_test_cases: 50
  test_seed: 42
  pretrain_ic: False
  train_adam: True
  train_lbfgs: False  
  n_epochs_pretrain: 4000

  # LR scheduling via ReduceLROnPlateau (stepped on validation only)
  lr_reduce_factor: 0.5     # multiply LR by this factor on plateau
  lr_patience: 500            # number of validations with no improvement before reducing
  lr_threshold: 1.0e-4      # minimum relative improvement to count as better
  lr_cooldown: 0            # validations to ignore after a reduction
  min_lr: 1.0e-6            # lower bound for LR

  # ============================================================
  # Loss Weight Scheduling (Unified Training Approach)
  # ============================================================
  loss_schedule:
    enabled: true
    stages:
      - name: "IC_u_pretraining"
        epochs: 4000
        weights:
          w_ic_u: 1.0
          w_ic_v: 0.0
          w_pde: 0.0
        lr: 1.0e-3

model:
  use_conv_branch: true
  conv_hidden_channels: [32, 32, 64, 64, 128, 128]
  n_sensors_ic: 20
  n_sensors_src: 20
  branch_width: 300
  trunk_width: 300
  branch_act: nn.Tanh()
  trunk_act: nn.Tanh()
  branch_depth: 4
  trunk_depth: 6
  p: 64
  wave_speed: 1.0
  damping_coeff: 1.0
  use_fft_trunk: true
  ntk_colloc_sample_size: 256   # Subset of collocation points for NTK computation (reduces memory)
  ntk_ic_sample_size: 64        # Subset of IC points for NTK computation (reduces memory)
  fft_trunk_args:
    input_dim: 3
    m_spatial_x: 64 
    m_spatial_y: 64
    m_temporal: 64
    sigma_spatial_x: 0.10
    sigma_spatial_y: 0.10
    sigma_temporal_list: [0.10]
    seed: 42
  strategy: 'fixed'
  fusion: 'hc'

data:
  n_colloc: 800
  n_ic: 50
  a_range: [-0.1, 0.6]
  b_range: [-0.1, 0.1]
  center_x_range: [0.3, 0.7]
  center_y_range: [0.3, 0.7]
  center_x: 0.5
  center_y: 0.5
  n_ic_u: 4
  n_ic_v: 4
  ic_coeff_mode: '2d'   # '1d' (diagonal) or '2d' (full KxL, MATLAB-consistent)
  source_type: 'zero'
  source_amplitude: 15.0
  T_max: 1.0
