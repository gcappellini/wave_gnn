hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

# Run settings
run:
  load_model: false
  resume_training: false
  load_from: null #'20251105_173641'

training:
  n_epochs: 5000
  lr: 0.001
  lr_scheduler_step: 500
  lr_scheduler_gamma: 0.95
  log_interval: 200
  val_interval: 20
  es_patience: 5000

model:
  n_sensors_ic: 40
  n_sensors_src: 20
  branch_width: 300
  trunk_width: 300
  branch_act: nn.LeakyReLU()
  trunk_act: nn.Tanh()
  branch_depth: 4
  trunk_depth: 8
  p: 300
  wave_speed: 1.0
  damping_coeff: 1.0
  use_fft_trunk: true
  fft_trunk_args:
    input_dim: 3
    m_spatial_x: 64 
    m_spatial_y: 64
    m_temporal: 64
    sigma_spatial_x: 1.0
    sigma_spatial_y: 1.0
    sigma_temporal_list: [1.0]
    seed: 42
  w_pde: 1.0
  w_ic_u: 50.0
  w_ic_v: 50.0
  strategy: 'ntk'

data:
  n_colloc: 800
  n_ic: 50
  a_range: [-0.1, 0.6]
  b_range: [-0.1, 0.1]
  center_x_range: [0.3, 0.7]
  center_y_range: [0.3, 0.7]
  n_ic_u: 2
  n_ic_v: 2
