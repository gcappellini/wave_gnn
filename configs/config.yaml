hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

# Run settings
run:
  # Model Loading
  load_model: true
  load_from: ['2025-12-18','01-11-20']  # [date, time] of checkpoint to load
  
  # Resume Training (continue from checkpoint)
  # Only used if load_model=true
  # If false: skip training and go directly to validation
  resume_training: false

training:
  n_epochs: 40000
  lr: 0.001
  lr_scheduler_gamma: 0.995  # Exponential decay factor per epoch (0.995 = ~0.5% decay/epoch)
  # log_interval: 200
  val_interval: 20
  es_patience: 5000
  max_grad_norm: 1.0
  max_grad_ph1: 0.6
  n_batches: 16
  n_batches_ph1: 16
  n_test_cases: 50
  test_seed: 42
  pretrain_ic: False
  train_adam: True
  train_lbfgs: False  
  n_epochs_pretrain: 4000

  # ============================================================
  # Loss Weight Scheduling (Unified Training Approach)
  # ============================================================
  loss_schedule:
    enabled: true
    stages:
      - name: "IC_u_pretraining"
        epochs: 1 #4000
        weights:
          w_ic_u: 1.0
          w_ic_v: 0.0
          w_pde: 0.0
        lr: 1.0e-3
        
      - name: "IC_v_training"
        epochs: 1 #4000
        weights:
          w_ic_u: 1.0
          w_ic_v: 1.0
          w_pde: 0.0
        lr: 5.0e-4
        
      - name: "PDE_training"
        epochs: 1 #4000
        weights:
          w_ic_u: 1.0
          w_ic_v: 1.0
          w_pde: 1.0
        lr: 1.0e-4

model:
  n_sensors_ic: 100
  n_sensors_src: 20
  branch_width: 1024
  trunk_width: 300
  branch_act: nn.Tanh()
  trunk_act: nn.Tanh()
  branch_depth: 4
  trunk_depth: 8
  p: 1024
  wave_speed: 1.0
  damping_coeff: 1.0
  use_fft_trunk: true
  ntk_colloc_sample_size: 256   # Subset of collocation points for NTK computation (reduces memory)
  ntk_ic_sample_size: 64        # Subset of IC points for NTK computation (reduces memory)
  fft_trunk_args:
    input_dim: 3
    m_spatial_x: 64 
    m_spatial_y: 64
    m_temporal: 64
    sigma_spatial_x: 0.10
    sigma_spatial_y: 0.10
    sigma_temporal_list: [0.10]
    seed: 42
  strategy: 'fixed'
  fusion: 'hc'

data:
  n_colloc: 800
  n_ic: 50
  a_range: [-0.1, 0.6]
  b_range: [-0.1, 0.1]
  center_x_range: [0.3, 0.7]
  center_y_range: [0.3, 0.7]
  center_x: 0.5
  center_y: 0.5
  n_ic_u: 2
  n_ic_v: 2
  source_type: 'zero'
  source_amplitude: 15.0
  T_max: 1.0
