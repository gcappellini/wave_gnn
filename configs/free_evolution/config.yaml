problem:
  name: free_evolution
  description: 2D wave equation with random Fourier IC, no forcing
  matlab:
    script: wave_2D_matlab_reference.m
    t_final: 1.0
    nt_time_steps: 100
    nx: 100
    ny: 100
    n_samples: 128
    wave_speed: 1.0
    damping: 1.0
    forcing_amplitude: 0.0
    fourier_modes_k: 4
    fourier_modes_l: 4
svd:
  n_modes: 18
  visualize: false
  magnitude_summary:
    raw_u:
      min: -0.839621
      max: 0.775219
    raw_v:
      min: -3.4379
      max: 3.63879
    svd_basis_u:
      min: 0.0
      max: 0.0148531
      mean: 0.00221094
      std: 0.00226091
    sigma_coeff_u:
      min: 7.36489e-05
      max: 50.3166
      mean: 4.86045
      std: 6.68257
    svd_basis_v:
      min: 0.0
      max: 0.0136041
      mean: 0.00224881
      std: 0.00222325
    sigma_coeff_v:
      min: 0.0010943
      max: 190.311
      mean: 31.2539
      std: 28.8003
networks:
  trunk:
    input_dim: 3
    output_dim: 18
    hidden_dim: 128
    n_layers: 4
    visualize: true
  branch:
    input_dim: 64
    output_dim: 18
    hidden_dim: 128
    n_layers: 4
    visualize: false
training:
  batch_size: 256
  learning_rate: 0.001
  train_test_split: 0.8
  trunk_n_epochs: 2000
  branch_n_epochs: 2000
  deeponet_n_epochs: 0
  max_trunk_points: 10000
  max_branch_samples: null
  max_deeponet_samples: null
  points_per_sample: 5000
  use_pinn_loss: false
  pde_loss_weight: 0.5
  n_collocation_per_batch: 4096
sensors:
  n_sensors: 8
