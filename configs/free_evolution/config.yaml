problem:
  name: free_evolution
  description: 2D wave equation with random Fourier IC, no forcing
  matlab:
    script: wave_2D_matlab_reference.m
    t_final: 1.0
    nt_time_steps: 100
    nx: 100
    ny: 100
    n_samples: 128
    wave_speed: 1.0
    damping: 1.0
    forcing_amplitude: 0.0
    fourier_modes_k: 4
    fourier_modes_l: 4
svd:
  n_modes: 18
  visualize: false
  magnitude_summary:
    raw_u:
      min: -0.671377
      max: 0.711303
    raw_v:
      min: -4.3718
      max: 4.28506
    svd_basis_u:
      min: 0.0
      max: 0.00577382
      mean: 0.00071895
      std: 0.000695062
    sigma_coeff_u:
      min: 0.000403327
      max: 150.295
      mean: 14.7651
      std: 21.5093
    svd_basis_v:
      min: 0.0
      max: 0.00539508
      mean: 0.00072088
      std: 0.00069306
    sigma_coeff_v:
      min: 0.0428712
      max: 629.967
      mean: 117.618
      std: 109.522
networks:
  trunk:
    input_dim: 3
    output_dim: 18
    hidden_dim: 128
    n_layers: 4
    visualize: false
  branch:
    input_dim: 64
    output_dim: 18
    hidden_dim: 128
    n_layers: 4
    visualize: true
training:
  batch_size: 256
  learning_rate: 0.001
  train_test_split: 0.8
  trunk_n_epochs: 2000
  branch_n_epochs: 2000
  deeponet_n_epochs: 400
  max_trunk_points: 10000
  max_branch_samples: null
  max_deeponet_samples: null
  points_per_sample: 5000
  use_pinn_loss: false
  pde_loss_weight: 0.5
  n_collocation_per_batch: 4096
sensors:
  n_sensors: 8
