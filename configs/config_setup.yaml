hydra:
  run:
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

# Run settings
run:
  # Phase 2 Model Loading (Full trained model)
  load_model: false
  load_from: null #['2025-12-13','13-38-38']
  
  # Phase 1 Model Loading (Pretrained IC reconstruction)
  load_pretrain: true
  load_pretrain_from: ['2025-12-16','12-27-31/1']
  continue_phase1_lbfgs: false  # Continue Phase 1 training with LBFGS only (requires load_pretrain=true)
  
  # Resume Training (continue from checkpoint)
  resume_training: false
  resume_from: null #['2025-12-13','13-38-38']

training:
  n_epochs: 40000
  lr: 0.001
  lr_scheduler_step: 500
  lr_scheduler_gamma: 0.95
  # LBFGS fine-tuning (optional, applied after Adam training)
  lbfgs_n_epochs: 100  # Number of LBFGS epochs
  lbfgs_max_iter: 20  # Max line search iterations per LBFGS step
  lbfgs_lr: 0.001
  log_interval: 200
  val_interval: 20
  es_patience: 5000
  max_grad_norm: 1.0
  max_grad_ph1: 0.6
  n_batches: 16
  n_batches_ph1: 16
  n_test_cases: 50
  test_seed: 42
  pretrain_ic: True
  train_adam: False
  train_lbfgs: False  
  n_epochs_pretrain: 4000
  
  # Phase 1 (IC Pretraining) specific settings
  lr_scheduler_step_ph1: 500        # Epochs before reducing LR in Phase 1
  lr_scheduler_gamma_ph1: 0.5       # LR reduction factor in Phase 1 (0.5 = divide by 2)
  use_lbfgs_finetune_ph1: false      # Enable LBFGS fine-tuning after Adam Phase 1
  lbfgs_n_epochs_ph1: 50           # Number of LBFGS epochs in Phase 1
  lbfgs_lr_ph1: 0.001               # Learning rate for LBFGS in Phase 1
  lbfgs_max_iter_ph1: 10           # Max line search iterations for LBFGS (reduced internally to save memory)
  lbfgs_history_size_ph1: 15        # History size for LBFGS (lower = less memory, default=100)

model:
  n_sensors_ic: 100
  n_sensors_src: 20
  branch_width: 1024
  trunk_width: 300
  branch_act: nn.Tanh()
  trunk_act: nn.Tanh()
  branch_depth: 4
  trunk_depth: 8
  p: 1024
  wave_speed: 1.0
  damping_coeff: 1.0
  use_fft_trunk: true
  fft_trunk_args:
    input_dim: 3
    m_spatial_x: 64 
    m_spatial_y: 64
    m_temporal: 64
    sigma_spatial_x: 0.10
    sigma_spatial_y: 0.10
    sigma_temporal_list: [0.10]
    seed: 42
  w_pde: 1.0
  w_ic_u: 50.0
  w_ic_v: 50.0
  strategy: 'ntk'
  fusion: 'hc'

data:
  n_colloc: 800
  n_ic: 50
  a_range: [-0.1, 0.6]
  b_range: [-0.1, 0.1]
  center_x_range: [0.3, 0.7]
  center_y_range: [0.3, 0.7]
  center_x: 0.5
  center_y: 0.5
  n_ic_u: 2
  n_ic_v: 2
  source_type: 'zero'
  source_amplitude: 15.0
  T_max: 1.0
