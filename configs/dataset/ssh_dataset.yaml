# Dataset configuration
num_graphs: 5000
num_steps: 6
dt: 0.01
train_ratio: 0.8
batch_size: 4  # Reduced from 32 to fit 8 training samples
shuffle: true
drop_last: false  # Allow incomplete batches

# Physics parameters
wave_speed: 1.0  # c
damping: 1.0     # k

# Mesh parameters
num_nodes: 100
domain_length: 1.0

# Force parameters
force:
  margin: 0.1
  sign: -1.0
  location: "casual"  # "casual" or fixed coordinates
  forcing_type: "middle"  # "casual", "start", "middle", "end".

